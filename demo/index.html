<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Offline Yaru Glass login, lock screen, and Ubuntu desktop simulation.">
  <link rel="icon" href="data:,">
  <title>Yaru Glass — Desktop Demo</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #171717; }
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
    iframe[hidden] { display: none; }
  </style>
</head>
<body>
  <iframe id="login-view" src="login-view.html?mode=login" title="Yaru Glass login screen"></iframe>
  <iframe id="desktop-view" src="desktop-view.html" title="Yaru Glass desktop" hidden inert aria-hidden="true"></iframe>
  <script>
    const loginView = document.querySelector('#login-view');
    const desktopView = document.querySelector('#desktop-view');
    let activeAccount = 'alex';

    function showView(active, inactive) {
      active.hidden = false;
      active.inert = false;
      active.removeAttribute('aria-hidden');
      inactive.hidden = true;
      inactive.inert = true;
      inactive.setAttribute('aria-hidden', 'true');
      active.focus();
    }

    function showLogin(mode) {
      loginView.src = `login-view.html?mode=${mode}&account=${encodeURIComponent(activeAccount)}`;
      showView(loginView, desktopView);
    }

    window.addEventListener('message', event => {
      const message = event.data;
      const trustedOrigin = event.origin === location.origin ||
        (location.protocol === 'file:' && event.origin === 'null');
      if (!trustedOrigin || !message || typeof message !== 'object') return;

      if (event.source === loginView.contentWindow && message.type === 'login-success') {
        activeAccount = ['alex', 'robin', 'sam'].includes(message.account) ? message.account : 'alex';
        showView(desktopView, loginView);
      } else if (event.source === desktopView.contentWindow && message.type === 'lock') {
        showLogin('locked');
      } else if (event.source === desktopView.contentWindow && message.type === 'logout') {
        showLogin('login');
      }
    });
  </script>
</body>
</html>
